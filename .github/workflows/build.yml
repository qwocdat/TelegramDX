name: Smart Build TelegramDX APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Chọn loại APK muốn build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: 'Tạo GitHub Release (tải APK trực tiếp không cần giải nén)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Auto-Unzip & Commit Patch Files
        run: |
          shopt -s nullglob
          ZIPS=(*.zip patches/*.zip)
          if [ ${#ZIPS[@]} -gt 0 ]; then
            echo "Phát hiện file patch: ${ZIPS[*]}"
            for z in "${ZIPS[@]}"; do
              unzip -o "$z" -d .
              rm -f "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Apply patch from zip [skip ci]"
              git push origin HEAD:master
            else
              echo "Không có thay đổi code nào sau khi giải nén."
            fi
          else
            echo "Không có file .zip nào, tiến hành build trực tiếp."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install SDK 36 & NDK 27.2.12479018
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$TYPE" = "release" ]; then
            ./gradlew :TMessagesProj_App:assembleRelease --no-daemon
          else
            ./gradlew :TMessagesProj_App:assembleDebug --no-daemon
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDX-${{ inputs.build_type || 'debug' }}-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk

      - name: Create GitHub Release (Optional)
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TelegramDX Build #${{ github.run_number }}
          files: TMessagesProj_App/build/outputs/apk/**/*.apk
