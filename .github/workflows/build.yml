name: Smart Build TelegramDX APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Chọn loại APK muốn build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: 'Tạo GitHub Release (tải APK trực tiếp không cần giải nén)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Auto-Unzip & Commit Patch Files
        run: |
          shopt -s nullglob
          ZIPS=(*.zip patches/*.zip)
          if [ ${#ZIPS[@]} -gt 0 ]; then
            echo "Phát hiện file patch: ${ZIPS[*]}"
            for z in "${ZIPS[@]}"; do
              unzip -o "$z" -d .
              rm -f "$z"
            done
            if [ -f "patches/apply_dx_hooks.py" ]; then
              python3 patches/apply_dx_hooks.py
            fi
            git checkout -- .github/workflows/ 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Apply TelegramDX LiquidGlass & Privacy mod [skip ci]"
              git pull --rebase origin master || true
              git push origin HEAD:master || true
            else
              echo "Không có thay đổi code nào khác so với bản cũ, tiến hành build trực tiếp."
            fi
          else
            echo "Không có file .zip nào, tiến hành build bình thường."
            if [ -f "patches/apply_dx_hooks.py" ]; then
              python3 patches/apply_dx_hooks.py
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Prebuilt Native Libs (.so)
        id: so-cache
        uses: actions/cache@v4
        with:
          path: prebuilt_so
          key: so-arm64-${{ hashFiles('TMessagesProj/jni/**') }}

      - name: Install SDK 36 & NDK 27.2.12479018
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          if [ "${{ steps.so-cache.outputs.cache-hit }}" != "true" ]; then
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          else
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Use Prebuilt .so & Skip CMake (If Cached)
        if: steps.so-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p TMessagesProj/src/main/jniLibs/arm64-v8a
          cp -f prebuilt_so/arm64-v8a/libtmessages*.so TMessagesProj/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp -f prebuilt_so/arm64-v8a/libtwidget*.so TMessagesProj/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          python3 - << 'EOF'
          import re, pathlib
          for path_str in ["TMessagesProj/build.gradle", "TMessagesProj_App/build.gradle"]:
              p = pathlib.Path(path_str)
              if not p.exists():
                  continue
              text = p.read_text()
              while True:
                  m = re.search(r'\bexternalNativeBuild\s*\{', text)
                  if not m:
                      break
                  start, idx, depth = m.start(), m.end(), 1
                  while idx < len(text) and depth > 0:
                      if text[idx] == '{':
                          depth += 1
                      elif text[idx] == '}':
                          depth -= 1
                      idx += 1
                  text = text[:start] + text[idx:]
              p.write_text(text)
          EOF

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (arm64-v8a)
        run: |
          TYPE="${{ inputs.build_type || 'debug' }}"
          GRADLE_ARGS="-Pandroid.injected.build.abi=arm64-v8a -x lint --parallel --max-workers=4 --no-daemon -Dorg.gradle.jvmargs=-Xmx4g"
          if [ "$TYPE" = "release" ]; then
            ./gradlew :TMessagesProj_App:assembleRelease $GRADLE_ARGS
          else
            ./gradlew :TMessagesProj_App:assembleDebug $GRADLE_ARGS
          fi

      - name: List Generated APKs
        run: find . -name "*.apk"

      - name: Extract .so for Future Fast Builds
        if: steps.so-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilt_so/arm64-v8a
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            unzip -j -o "$APK_FILE" "lib/arm64-v8a/*.so" -d prebuilt_so/arm64-v8a/ || true
          else
            find . -path "*/arm64-v8a/*.so" -exec cp -f {} prebuilt_so/arm64-v8a/ \; || true
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDX-${{ inputs.build_type || 'debug' }}-APK
          path: |
            **/*.apk
            !**/intermediates/**

      - name: Create GitHub Release (Optional)
        if: inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TelegramDX Build #${{ github.run_number }}
          files: |
            **/*.apk
            !**/intermediates/**
